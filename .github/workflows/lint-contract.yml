name: contract lint

on:
  push:
    branches: [main]
    paths:
      - 'src/RestaurantBackend/Mcp/**'
      - 'infra/apim/**'
      - 'measure/lint_contract.py'
      - '.github/workflows/lint-contract.yml'
  pull_request:
    paths:
      - 'src/RestaurantBackend/Mcp/**'
      - 'infra/apim/**'
      - 'measure/lint_contract.py'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Lint the tool contract
        run: python measure/lint_contract.py
